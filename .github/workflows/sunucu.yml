# ÖTÜKEN oyun sunucusunu Cloudflare'e kurar. sunucu/ klasörü değiştiğinde kendiliğinden çalışır.
# Gerekli depo sırları: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Sonuç: sunucu.json (oyunun bağlanacağı adres) ve sunucu/son-kurulum.txt (kurulum kaydı) depoya yazılır.
name: Sunucu kurulumu
on:
  push:
    branches: [main]
    paths: ['sunucu/**', '.github/workflows/sunucu.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: sunucu
jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cloudflare'e kur
        id: kur
        working-directory: sunucu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          set +e
          npx wrangler deploy > kurulum.log 2>&1
          rc=$?
          set -e
          cat kurulum.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' kurulum.log | head -1)
          { echo "Tarih: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "Sonuc: $rc"; echo "Adres: $url"; echo; tail -n 40 kurulum.log; } > son-kurulum.txt
          rm -f kurulum.log
          if [ "$rc" = "0" ] && [ -n "$url" ]; then printf '{"ws":"%s"}\n' "${url/https:/wss:}" > ../sunucu.json; fi
      - name: Sonucu depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add sunucu/son-kurulum.txt sunucu.json 2>/dev/null || git add sunucu/son-kurulum.txt
          git diff --cached --quiet || git commit -m "Sunucu kurulumu: $(grep '^Sonuc' sunucu/son-kurulum.txt)"
          git push
